services:
  mysql:
    image: mysql:8.4
    container_name: foodsource-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodsource
      MYSQL_USER: foodsource
      MYSQL_PASSWORD: foodsource
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - foodsource_mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/03-users.sql:/docker-entrypoint-initdb.d/03-users.sql:ro
      - ./sql/05-buyers-orders.sql:/docker-entrypoint-initdb.d/05-buyers-orders.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  foodsource_mysql_data:
